name: Test SEC Compliance Engine

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-compliance-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SEC Swap Simulation
        run: python simulate_tsv_swap.py
